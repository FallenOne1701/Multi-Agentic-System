# Render Blueprint — FastAPI backend (repo root).
# Dashboard: New → Blueprint → connect this repo, or New Web Service + these settings.
# Secrets (GROQ_API_KEY, etc.) are prompted / set in the dashboard (sync: false).
services:
  - type: web
    name: groww-support-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn groww_support.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GROWW_USE_LLM
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
